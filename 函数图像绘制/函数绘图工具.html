<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专业级函数绘图器</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.min.js"></script>
<style>
  *{box-sizing:border-box;font-family:system-ui}
  body{margin:0;padding:20px;background:#f7f7f7}
  .container{max-width:1200px;margin:auto;background:#fff;padding:24px;border-radius:12px}
  .tabbar{display:flex;gap:10px;margin-bottom:20px}
  .tab{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;background:#eee}
  .tab.active{background:#007bff;color:#fff}
  .panel{display:none}
  .panel.active{display:block}
  .row{display:flex;gap:10px;margin:10px 0}
  .col{flex:1}
  input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}
  button{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;background:#007bff;color:#fff}
  .clear{background:#dc3545}
  #plot2d, #plot3d{width:100%;height:600px;margin-top:15px}
</style>
</head>
<body>
<div class="container">
  <h2>专业级函数绘图器（精准版）</h2>
  <div class="tabbar">
    <button class="tab active" onclick="show('2d')">2D 函数（支持叠加）</button>
    <button class="tab" onclick="show('3d')">3D 曲面</button>
  </div>

  <div id="panel2d" class="panel active">
    <input id="f2" placeholder="函数表达式，例如 x^2, sin(x)+cos(x), x*2+1" value="x^2">
    <div class="row">
      <div class="col"><input id="xmin2" placeholder="X最小值" value="-10"></div>
      <div class="col"><input id="xmax2" placeholder="X最大值" value="10"></div>
      <div class="col"><input id="ymin2" placeholder="Y最小值" value="-10"></div>
      <div class="col"><input id="ymax2" placeholder="Y最大值" value="10"></div>
    </div>
    <button onclick="add2d()">添加/叠加函数</button>
    <button class="clear" onclick="clear2d()">清空</button>
    <div id="plot2d"></div>
  </div>

  <div id="panel3d" class="panel">
    <input id="f3" placeholder="函数表达式，例如 x^2+y^2, sin(sqrt(x^2+y^2))" value="x^2+y^2">
    <div class="row">
      <div class="col"><input id="xmin3" placeholder="X最小值" value="-5"></div>
      <div class="col"><input id="xmax3" placeholder="X最大值" value="5"></div>
      <div class="col"><input id="ymin3" placeholder="Y最小值" value="-5"></div>
      <div class="col"><input id="ymax3" placeholder="Y最大值" value="5"></div>
    </div>
    <button onclick="draw3d()">绘制曲面</button>
    <button class="clear" onclick="clear3d()">清空</button>
    <div id="plot3d"></div>
  </div>
</div>

<script>
let mode = '2d';
let traces2d = [];

function show(p) {
  mode = p;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(e=>e.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel'+p).classList.add('active');
}

function add2d() {
  const f = document.getElementById('f2').value.trim();
  const xmin = parseFloat(document.getElementById('xmin2').value);
  const xmax = parseFloat(document.getElementById('xmax2').value);
  const ymin = parseFloat(document.getElementById('ymin2').value);
  const ymax = parseFloat(document.getElementById('ymax2').value);

  const x = math.range(xmin, xmax, (xmax-xmin)/2000).toArray();
  let y;
  try {
    y = x.map(xi => math.evaluate(f, {x: xi}));
  } catch (e) {
    alert('函数表达式错误：' + e.message);
    return;
  }

  traces2d.push({
    x: x, y: y, mode: 'lines', name: f, line: {width: 2}
  });

  const layout = {
    title: '2D 函数图像',
    xaxis: {title: 'x', range: [xmin, xmax], dtick: 1, gridcolor: '#eee'},
    yaxis: {title: 'y', range: [ymin, ymax], dtick: 1, gridcolor: '#eee'},
    showlegend: true
  };

  Plotly.newPlot('plot2d', traces2d, layout);
  document.getElementById('f2').value = '';
}

function clear2d() {
  traces2d = [];
  Plotly.purge('plot2d');
}

function draw3d() {
  const f = document.getElementById('f3').value.trim();
  const xmin = parseFloat(document.getElementById('xmin3').value);
  const xmax = parseFloat(document.getElementById('xmax3').value);
  const ymin = parseFloat(document.getElementById('ymin3').value);
  const ymax = parseFloat(document.getElementById('ymax3').value);

  const x = math.range(xmin, xmax, (xmax-xmin)/80).toArray();
  const y = math.range(ymin, ymax, (ymax-ymin)/80).toArray();
  const z = [];

  try {
    for (let i=0; i<y.length; i++) {
      const row = [];
      for (let j=0; j<x.length; j++) {
        row.push(math.evaluate(f, {x: x[j], y: y[i]}));
      }
      z.push(row);
    }
  } catch (e) {
    alert('函数表达式错误：' + e.message);
    return;
  }

  const data = [{
    x: x, y: y, z: z, type: 'surface', name: f,
    colorscale: 'Viridis', opacity: 0.85
  }];

  const layout = {
    title: `3D 曲面: ${f}`,
    scene: {
      xaxis: {title: 'X', dtick: 1},
      yaxis: {title: 'Y', dtick: 1},
      zaxis: {title: 'Z', dtick: 1}
    }
  };

  Plotly.newPlot('plot3d', data, layout);
}

function clear3d() {
  Plotly.purge('plot3d');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frictionless Inbox — 无脑收件箱</title>
<style>
/* ============================================ */
/*  CSS 变量 & 基础                              */
/* ============================================ */
:root {
  --bg:           #F2F2F7;
  --surface:      #FFFFFF;
  --text:         #1C1C1E;
  --text2:        #6C6C70;
  --text3:        #AEAEB2;
  --border:       #E5E5EA;
  --shadow:       0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:    0 8px 32px rgba(0,0,0,.08);
  --radius:       14px;
  --radius-sm:    8px;
  --primary:      #5B6AF0;
  --primary-dim:  #EEF0FF;
  --todo:         #FF9500;
  --todo-dim:     #FFF3E0;
  --calendar:     #34C759;
  --cal-dim:      #E8F8ED;
  --knowledge:    #AF52DE;
  --know-dim:     #F3E8FA;
  --danger:       #FF3B30;
  --font:         -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  --transition:   0.2s cubic-bezier(.4,0,.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ============================================ */
/*  布局                                        */
/* ============================================ */
.app{
  max-width:720px;
  margin:0 auto;
  padding:16px 20px 80px;
}

/* ============================================ */
/*  头部                                        */
/* ============================================ */
.header{
  text-align:center;
  padding:32px 0 8px;
}
.header .icon{ font-size:40px; display:block; margin-bottom:4px; }
.header h1{ font-size:26px; font-weight:700; letter-spacing:-0.3px; }
.header .subtitle{ color:var(--text2); font-size:14px; margin-top:2px; }

/* ============================================ */
/*  输入区 —— 核心：极简、醒目                    */
/* ============================================ */
.input-zone{
  position:sticky;
  top:16px;
  z-index:100;
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:20px;
  margin-bottom:20px;
  transition:box-shadow var(--transition);
}
.input-zone:focus-within{
  box-shadow:0 0 0 3px var(--primary-dim), var(--shadow-lg);
}

.input-zone textarea{
  width:100%;
  border:none;
  outline:none;
  resize:none;
  font-size:16px;
  font-family:var(--font);
  color:var(--text);
  line-height:1.7;
  min-height:60px;
  max-height:200px;
  background:transparent;
}
.input-zone textarea::placeholder{ color:var(--text3); }

.input-zone .input-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:12px;
  gap:10px;
}

.input-zone .char-hint{
  font-size:12px;
  color:var(--text3);
  flex:1;
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 18px;
  border-radius:20px;
  border:none;
  font-size:14px;
  font-family:var(--font);
  cursor:pointer;
  transition:all var(--transition);
  font-weight:500;
  white-space:nowrap;
}
.btn-primary{
  background:var(--primary);
  color:#fff;
}
.btn-primary:hover{ filter:brightness(1.1); transform:translateY(-1px); }
.btn-primary:active{ transform:scale(0.97); }

.btn-ghost{
  background:var(--bg);
  color:var(--text);
}
.btn-ghost:hover{ background:var(--border); }

.btn-sm{ padding:5px 12px; font-size:13px; border-radius:14px; }
.btn-danger{ background:var(--danger); color:#fff; }

/* 图片预览 */
.img-preview-wrap{
  position:relative;
  display:inline-block;
  margin-top:10px;
}
.img-preview-wrap img{
  max-height:120px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
}
.img-preview-wrap .img-remove{
  position:absolute;
  top:-8px;
  right:-8px;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--danger);
  color:#fff;
  border:none;
  font-size:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 处理动画 */
.processing{
  display:none;
  align-items:center;
  gap:8px;
  padding:8px 0 0;
  color:var(--primary);
  font-size:13px;
  font-weight:500;
}
.processing.active{ display:flex; }
.processing .dot-pulse{
  display:flex;gap:4px;
}
.processing .dot-pulse span{
  width:5px;height:5px;
  border-radius:50%;
  background:var(--primary);
  animation:bounce 1.2s infinite;
}
.processing .dot-pulse span:nth-child(2){animation-delay:.15s}
.processing .dot-pulse span:nth-child(3){animation-delay:.3s}
@keyframes bounce{
  0%,80%,100%{transform:scale(0);opacity:0}
  40%{transform:scale(1);opacity:1}
}

/* 分类结果气泡 */
.classify-preview{
  display:none;
  flex-wrap:wrap;
  gap:6px;
  padding:6px 0 0;
}
.classify-preview.active{ display:flex; }
.classify-preview .badge{
  font-size:11px;
  padding:2px 10px;
  border-radius:10px;
  font-weight:500;
}
.badge-todo{ background:var(--todo-dim); color:var(--todo); }
.badge-calendar{ background:var(--cal-dim); color:var(--calendar); }
.badge-knowledge{ background:var(--know-dim); color:var(--knowledge); }
.badge-inbox{ background:var(--bg); color:var(--text2); }

/* ============================================ */
/*  标签栏                                      */
/* ============================================ */
.tab-bar{
  display:flex;
  gap:6px;
  margin-bottom:16px;
}
.tab-btn{
  flex:1;
  padding:12px 8px;
  border:none;
  border-radius:var(--radius-sm);
  background:var(--surface);
  cursor:pointer;
  font-family:var(--font);
  font-size:13px;
  font-weight:500;
  color:var(--text2);
  transition:all var(--transition);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  box-shadow:var(--shadow);
}
.tab-btn .tab-icon{ font-size:20px; }
.tab-btn .tab-count{ font-size:18px; font-weight:700; }
.tab-btn.active{
  background:var(--primary);
  color:#fff;
  box-shadow:0 4px 12px rgba(91,106,240,.35);
}
.tab-btn:hover:not(.active){ background:var(--primary-dim); }

/* ============================================ */
/*  内容区                                      */
/* ============================================ */
.content-area{ position:relative; min-height:200px; }

.tab-panel{ display:none; }
.tab-panel.active{ display:block; }

/* ============================================ */
/*  卡片                                        */
/* ============================================ */
.card{
  background:var(--surface);
  border-radius:var(--radius-sm);
  padding:16px;
  margin-bottom:10px;
  box-shadow:var(--shadow);
  transition:all var(--transition);
  position:relative;
}
.card:hover{ box-shadow:var(--shadow-lg); }
.card.completed{ opacity:0.5; }
.card.completed .card-title{ text-decoration:line-through; }

.card-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.card-title{
  font-size:15px;
  font-weight:600;
  flex:1;
  word-break:break-word;
  cursor:text;
  padding:2px 4px;
  border-radius:4px;
  transition:background var(--transition);
  border:1px solid transparent;
}
.card-title:hover{ background:var(--primary-dim); }
.card-title.editing{
  background:var(--bg);
  border-color:var(--primary);
  outline:none;
  cursor:text;
}
.card-title-input{
  flex:1;
  font-size:15px;
  font-weight:600;
  font-family:var(--font);
  padding:2px 4px;
  border:1px solid var(--primary);
  border-radius:4px;
  outline:none;
  background:var(--bg);
}
.card-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
  align-items:center;
}
.card .badge{ font-size:11px; padding:2px 10px; border-radius:10px; font-weight:500; }
.card .date-badge{
  font-size:11px;
  color:var(--danger);
  background:#FFF0EF;
  padding:2px 10px;
  border-radius:10px;
  font-weight:500;
}
.card .date-badge.soon{ color:var(--todo); background:var(--todo-dim); }
.card .date-badge.ok{ color:var(--calendar); background:var(--cal-dim); }

.card-body{
  font-size:13px;
  color:var(--text2);
  margin-top:8px;
  white-space:pre-wrap;
  word-break:break-word;
  max-height:120px;
  overflow-y:auto;
}
.card-body.expanded{ max-height:none; }
.card-body-toggle{
  font-size:12px;
  color:var(--primary);
  cursor:pointer;
  margin-top:4px;
  display:inline-block;
}

.card-actions{
  display:flex;
  gap:6px;
  margin-top:10px;
}
.card-time{
  font-size:11px;
  color:var(--text3);
  margin-top:4px;
}

/* 知识卡片特色样式 */
.card.knowledge-card{
  border-left:3px solid var(--knowledge);
}
.card.todo-card{
  border-left:3px solid var(--todo);
}
.card.inbox-card{
  border-left:3px solid var(--primary);
}

/* ============================================ */
/*  日历                                        */
/* ============================================ */
.calendar-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.calendar-nav .month-label{ font-size:17px; font-weight:700; }
.calendar-nav button{
  width:32px;height:32px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all var(--transition);
}
.calendar-nav button:hover{ background:var(--primary-dim); }

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  text-align:center;
}
.calendar-grid .day-header{
  font-size:12px;
  color:var(--text3);
  padding:8px 0;
  font-weight:500;
}
.calendar-grid .day-cell{
  aspect-ratio:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:14px;
  cursor:pointer;
  transition:all var(--transition);
  position:relative;
}
.calendar-grid .day-cell:hover{ background:var(--primary-dim); }
.calendar-grid .day-cell.today{ background:var(--primary); color:#fff; font-weight:700; }
.calendar-grid .day-cell.has-items::after{
  content:'';
  position:absolute;
  bottom:3px;
  width:5px;height:5px;
  border-radius:50%;
  background:var(--primary);
}
.calendar-grid .day-cell.today.has-items::after{ background:#fff; }
.calendar-grid .day-cell.other-month{ color:var(--text3); }
.calendar-grid .day-cell.selected{ outline:2px solid var(--primary); outline-offset:-2px; }

.date-items-list{
  margin-top:16px;
}
.date-items-list h3{
  font-size:14px;
  font-weight:600;
  margin-bottom:8px;
  color:var(--text2);
}

/* ============================================ */
/*  空状态                                      */
/* ============================================ */
.empty-state{
  text-align:center;
  padding:48px 20px;
  color:var(--text3);
}
.empty-state .empty-icon{ font-size:48px; display:block; margin-bottom:12px; }
.empty-state p{ font-size:14px; }

/* ============================================ */
/*  提示消息                                    */
/* ============================================ */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#1C1C1E;
  color:#fff;
  padding:10px 24px;
  border-radius:20px;
  font-size:14px;
  z-index:999;
  transition:transform 0.35s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.toast.show{ transform:translateX(-50%) translateY(0); }

/* ============================================ */
/*  设置面板                                    */
/* ============================================ */
.header-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.btn-settings{
  width:34px;height:34px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  cursor:pointer;
  font-size:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all var(--transition);
  position:relative;
}
.btn-settings:hover{ background:var(--primary-dim); }
.btn-settings .ai-dot{
  position:absolute;
  top:2px;right:2px;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--calendar);
  border:1.5px solid var(--surface);
  display:none;
}
.btn-settings .ai-dot.active{ display:block; }

/* 模态遮罩 */
.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:200;
  align-items:center;
  justify-content:center;
}
.modal-overlay.show{ display:flex; }

.modal{
  background:var(--surface);
  border-radius:var(--radius);
  padding:24px;
  width:90%;
  max-width:420px;
  max-height:85vh;
  overflow-y:auto;
  box-shadow:var(--shadow-lg);
  animation:modalIn .25s ease;
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(20px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}
.modal-header h2{ font-size:18px; font-weight:700; }
.modal-close{
  width:28px;height:28px;
  border-radius:50%;
  border:none;
  background:var(--bg);
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal-close:hover{ background:var(--border); }

.form-group{
  margin-bottom:14px;
}
.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:4px;
  color:var(--text);
}
.form-group .hint{
  font-size:11px;
  color:var(--text3);
  margin-bottom:4px;
}
.form-group input,
.form-group select{
  width:100%;
  padding:9px 12px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:14px;
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  outline:none;
  transition:border var(--transition);
}
.form-group input:focus,
.form-group select:focus{
  border-color:var(--primary);
}

/* 开关 */
.toggle-wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.toggle{
  width:48px;height:28px;
  border-radius:14px;
  background:var(--border);
  cursor:pointer;
  position:relative;
  transition:background var(--transition);
  flex-shrink:0;
}
.toggle.on{ background:var(--primary); }
.toggle::after{
  content:'';
  position:absolute;
  top:3px;left:3px;
  width:22px;height:22px;
  border-radius:50%;
  background:#fff;
  transition:transform var(--transition);
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.toggle.on::after{ transform:translateX(20px); }

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}
.modal-actions .btn{ flex:1; justify-content:center; }

.ai-status-bar{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:16px;
  font-size:11px;
  font-weight:500;
  margin-bottom:8px;
}
.ai-status-bar.online{
  background:#E8F8ED;
  color:var(--calendar);
}
.ai-status-bar.offline{
  background:var(--bg);
  color:var(--text3);
}
.ai-status-bar .status-dot{
  width:6px;height:6px;
  border-radius:50%;
  flex-shrink:0;
}
.ai-status-bar.online .status-dot{ background:var(--calendar); }
.ai-status-bar.offline .status-dot{ background:var(--text3); }

/* ============================================ */
/*  响应式                                      */
/* ============================================ */
@media(max-width:500px){
  .app{ padding:10px 12px 60px; }
  .header{ padding:20px 0 4px; }
  .header h1{ font-size:22px; }
  .tab-btn{ font-size:11px; padding:10px 4px; }
  .tab-btn .tab-icon{ font-size:18px; }
  .tab-btn .tab-count{ font-size:15px; }
  .card{ padding:12px; }
  .input-zone{ padding:14px; }
  .input-zone textarea{ font-size:15px; }
  .btn{ font-size:13px; padding:7px 14px; }
}
</style>
</head>
<body>

<div class="app">
  <!-- ========== 头部 ========== -->
  <header class="header">
    <span class="icon">📥</span>
    <div class="header-row">
      <h1>Frictionless Inbox</h1>
      <button class="btn-settings" id="btnSettings" title="AI 分类设置">
        ⚙️
        <span class="ai-dot" id="aiDot"></span>
      </button>
    </div>
    <p class="subtitle">无脑扔进来 · 自动分出去</p>
    <div class="ai-status-bar offline" id="aiStatusBar">
      <span class="status-dot"></span>
      <span id="aiStatusText">本地规则引擎</span>
    </div>
  </header>

  <!-- ========== 输入区 ========== -->
  <section class="input-zone" id="inputZone">
    <textarea id="inputText" rows="2"
      placeholder="随便扔点什么进来…&#10;复制网页文字、待办事项、一闪而过的想法、论文片段……不用分类，直接丢进来就行。"
    ></textarea>
    <div class="img-preview-wrap" id="imgPreviewWrap" style="display:none">
      <img id="imgPreview" src="" alt="预览">
      <button class="img-remove" id="imgRemove" title="移除图片">&times;</button>
    </div>
    <div class="processing" id="processing">
      <span>🧠 智能识别中</span>
      <span class="dot-pulse"><span></span><span></span><span></span></span>
    </div>
    <div class="classify-preview" id="classifyPreview"></div>
    <div class="input-row">
      <span class="char-hint" id="charHint">Ctrl + Enter 快速提交</span>
      <input type="file" accept="image/*" id="imageInput" style="display:none">
      <button class="btn btn-ghost btn-sm" id="uploadBtn" title="上传截图或照片">📎 图片</button>
      <button class="btn btn-primary" id="submitBtn">丢进去 →</button>
    </div>
  </section>

  <!-- ========== 标签栏 ========== -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="inbox">
      <span class="tab-icon">📥</span>
      <span class="tab-count" id="countInbox">0</span>
      <span>收件箱</span>
    </button>
    <button class="tab-btn" data-tab="todo">
      <span class="tab-icon">✅</span>
      <span class="tab-count" id="countTodo">0</span>
      <span>待办清单</span>
    </button>
    <button class="tab-btn" data-tab="calendar">
      <span class="tab-icon">📅</span>
      <span class="tab-count" id="countCalendar">0</span>
      <span>日历</span>
    </button>
    <button class="tab-btn" data-tab="knowledge">
      <span class="tab-icon">📚</span>
      <span class="tab-count" id="countKnowledge">0</span>
      <span>知识卡片</span>
    </button>
  </nav>

  <!-- 回收站入口 -->
  <div style="text-align:center;margin-bottom:12px;">
    <button class="btn btn-ghost btn-sm" id="btnTrash" style="font-size:12px;color:var(--text3);">
      🗑️ 回收站 <span id="trashHint" style="opacity:0.6;"></span>
    </button>
  </div>

  <!-- ========== 内容区 ========== -->
  <div class="content-area">
    <div class="tab-panel active" id="panel-inbox"></div>
    <div class="tab-panel" id="panel-todo"></div>
    <div class="tab-panel" id="panel-calendar"></div>
    <div class="tab-panel" id="panel-knowledge"></div>
    <div class="tab-panel" id="panel-trash"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ========== 设置面板 ========== -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>⚙️ AI 分类设置</h2>
      <button class="modal-close" id="settingsClose">&times;</button>
    </div>

    <div class="form-group">
      <div class="toggle-wrap">
        <label>🧠 AI 智能分类</label>
        <div class="toggle" id="toggleAI"></div>
      </div>
      <span class="hint">开启后由 AI 大模型识别内容，分类更精准。关闭时使用本地规则引擎。</span>
    </div>

    <div class="form-group">
      <label>API 提供商</label>
      <select id="aiProvider"></select>
    </div>

    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="aiApiKey" placeholder="sk-… 或 anthropic-…">
      <span class="hint">🔒 仅存储在本浏览器，不会上传到任何服务器</span>
    </div>

    <div class="form-group">
      <label>模型</label>
      <select id="aiModel"></select>
    </div>

    <div class="modal-actions">

<script>
/* ============================================
   数据存储层
   ============================================ */
const DB = {
  KEY: 'frictionless_inbox_v2',

  getAll() {
    try {
      const raw = localStorage.getItem(this.KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  },

  saveAll(items) {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(items));
    } catch(e) {
      if (e.name === 'QuotaExceededError') {
        this._showToast('⚠️ 存储空间不足，请清理一些旧条目');
      }
    }
  },

  add(item) {
    const items = this.getAll();
    items.unshift(item); // 最新的在前面
    this.saveAll(items);
    return item;
  },

  update(id, updates) {
    const items = this.getAll();
    const idx = items.findIndex(i => i.id === id);
    if (idx !== -1) {
      items[idx] = { ...items[idx], ...updates };
      this.saveAll(items);
    }
  },

  remove(id) {
    const items = this.getAll().filter(i => i.id !== id);
    this.saveAll(items);
  },

  _showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
};

/* ============================================
   居中确认弹窗
   ============================================ */
function showConfirm(title, msg, icon, okLabel) {
  return new Promise(resolve => {
    const overlay = document.getElementById('confirmOverlay');
    document.getElementById('confirmIcon').textContent = icon || '🗑️';
    document.getElementById('confirmTitle').textContent = title || '确认';
    document.getElementById('confirmMsg').textContent = msg || '';
    document.getElementById('confirmOk').textContent = okLabel || '确认删除';

    overlay.classList.add('show');

    const cleanup = () => {
      overlay.classList.remove('show');
      document.getElementById('confirmCancel').removeEventListener('click', onCancel);
      document.getElementById('confirmOk').removeEventListener('click', onOk);
      overlay.removeEventListener('click', onOverlay);
      document.removeEventListener('keydown', onKey);
    };

    const onCancel = () => { cleanup(); resolve(false); };
    const onOk = () => { cleanup(); resolve(true); };
    const onOverlay = (e) => { if (e.target === overlay) { cleanup(); resolve(false); } };
    const onKey = (e) => { if (e.key === 'Escape') { cleanup(); resolve(false); } };

    document.getElementById('confirmCancel').addEventListener('click', onCancel);
    document.getElementById('confirmOk').addEventListener('click', onOk);
    overlay.addEventListener('click', onOverlay);
    document.addEventListener('keydown', onKey);
  });
}

/* ============================================
   回收站存储
   ============================================ */
const TrashDB = {
  KEY: 'frictionless_inbox_trash',

  getAll() {
    try {
      const raw = localStorage.getItem(this.KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  },

  saveAll(items) {
    localStorage.setItem(this.KEY, JSON.stringify(items));
  },

  /** 移入回收站 */
  moveIn(item) {
    const trash = this.getAll();
    trash.unshift({
      ...item,
      deletedAt: new Date().toISOString(),
    });
    this.saveAll(trash);
  },

  /** 恢复 */
  restore(id) {
    const trash = this.getAll();
    const idx = trash.findIndex(i => i.id === id);
    if (idx === -1) return null;
    const [restored] = trash.splice(idx, 1);
    this.saveAll(trash);
    // 清理回收站字段
    const { deletedAt, ...item } = restored;
    return item;
  },

  /** 彻底删除 */
  removeForever(id) {
    const trash = this.getAll().filter(i => i.id !== id);
    this.saveAll(trash);
  },

  /** 清空回收站 */
  emptyAll() {
    this.saveAll([]);
  },

  /** 清理过期条目（>7天），返回清理数量 */
  cleanExpired() {
    const now = Date.now();
    const MS_7_DAYS = 7 * 24 * 60 * 60 * 1000;
    const trash = this.getAll();
    const valid = trash.filter(i => {
      const deletedTime = new Date(i.deletedAt).getTime();
      return (now - deletedTime) < MS_7_DAYS;
    });
    const removed = trash.length - valid.length;
    if (removed > 0) this.saveAll(valid);
    return removed;
  },
};

/* ============================================
   AI 分类器（调用大模型 API）
   ============================================ */
const AIClassifier = {

  /**
   * 调用 AI 进行分类，返回与 Brain.analyze() 相同格式的结果
   * 失败时返回 null，由调用方回退到本地引擎
   */
  async classify(text) {
    const settings = Settings.getAll();
    if (!settings.apiKey) return null;

    const prompt = this._buildPrompt(text);

    try {
      let response;
      const provider = PROVIDERS[settings.provider];
      if (!provider) return null;
      if (provider.format === 'anthropic') {
        response = await this._callAnthropic(settings, provider, prompt);
      } else {
        response = await this._callOpenAICompatible(settings, provider, prompt);
      }
      return this._parseResponse(response, text);
    } catch (e) {
      console.warn('AI 分类失败，回退本地引擎:', e.message);
      return null;
    }
  },

  /** 测试 API 连接 */
  async testConnection() {
    const settings = Settings.getAll();
    if (!settings.apiKey) return { ok: false, error: '请先填写 API Key' };

    try {
      const provider = PROVIDERS[settings.provider];
      if (!provider) return { ok: false, error: '未知提供商' };
      if (provider.format === 'anthropic') {
        await this._callAnthropic(settings, provider, '回复"OK"');
      } else {
        await this._callOpenAICompatible(settings, provider, '回复"OK"');
      }
      return { ok: true };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  },

  /** 构建分类提示词 */
  _buildPrompt(text) {
    return `你是一个智能分类助手。分析以下用户输入的文字，返回一个 JSON 对象。

## 分类规则
- **todo**(待办): 包含明确的行动意图，需要用户去做某事。例如：交作业、写报告、去拿快递、记得开会、需要完成…
- **calendar**(日历): 包含明确的截止日期或时间点。例如：12月15日、明天、下周…
- **knowledge**(知识): 包含学术、技术、理论、学科知识等内容。例如：数学公式、物理原理、编程概念、哲学思想…
- **inbox**(收件箱): 以上都不匹配的日常碎片、闲聊、情绪表达等。

一条文字可以同时属于多个分类（例如"明天交数学作业"既是todo又是calendar）。

## 返回格式
必须返回纯 JSON，不要包含其他文字：
{
  "categories": ["todo", "calendar"],
  "title": "简短的标题（≤30字）",
  "deadline": "YYYY-MM-DD 或 null",
  "tags": ["标签1", "标签2"],
  "summary": "一句话概括（≤100字）"
}

## 用户输入
${text}`;
  },

  /** Anthropic API */
  async _callAnthropic(settings, provider, prompt) {
    const headers = { 'Content-Type': 'application/json', 'anthropic-version': '2023-06-01' };
    headers[provider.keyHeader] = (provider.keyPrefix || '') + settings.apiKey;

    const resp = await fetch(provider.endpoint, {
      method: 'POST', headers,
      body: JSON.stringify({
        model: settings.model,
        max_tokens: 500,
        messages: [{ role: 'user', content: prompt }],
      }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    return data.content[0].text;
  },

  /** OpenAI 兼容 API（OpenAI、DeepSeek、智谱、Kimi、通义千问、豆包、Groq、Gemini…） */
  async _callOpenAICompatible(settings, provider, prompt) {
    const headers = { 'Content-Type': 'application/json' };
    headers[provider.keyHeader] = (provider.keyPrefix || '') + settings.apiKey;

    const body = {
      model: settings.model,
      messages: [
        { role: 'system', content: '你是一个分类助手。始终返回纯 JSON，不要包含 markdown 代码块或其他文字。' },
        { role: 'user', content: prompt },
      ],
      max_tokens: 500,
    };
    // OpenAI 专有：response_format；其他家兼容则忽略报错
    if (provider.format === 'openai' && settings.provider === 'openai') {
      body.response_format = { type: 'json_object' };
    }

    const resp = await fetch(provider.endpoint, {
      method: 'POST', headers,
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    return data.choices[0].message.content;
  },

  /** 解析 AI 返回的 JSON，标准化为 Brain.analyze() 格式 */
  _parseResponse(raw, originalText) {
    let json = raw.trim();
    json = json.replace(/^```(?:json)?\s*/, '').replace(/\s*```$/, '');
    const parsed = JSON.parse(json);
    return {
      categories: (parsed.categories || []).filter(c =>
        ['todo','calendar','knowledge','inbox'].includes(c)),
      title: parsed.title || originalText.slice(0, 40),
      // 区分截止日期和事件日期
      deadline: parsed.deadline && parsed.deadline !== 'null' ? parsed.deadline : null,
      eventDate: parsed.eventDate && parsed.eventDate !== 'null' ? parsed.eventDate : null,
      tags: parsed.tags || [],
      summary: parsed.summary || originalText.slice(0, 200),
    };
  },
};
const Brain = {

  /**
   * 分析文本，返回分类结果
   */
  analyze(text) {
    const result = {
      categories: [],       // ['todo', 'calendar', 'knowledge']
      title: '',
      deadline: null,       // Date or null — 截止日期（有"前/截止"等压力词）
      eventDate: null,      // Date or null — 事件日期（某件事发生的当天）
      tags: [],
      summary: '',
    };

    if (!text.trim()) return result;

    // --- 提取标题（第一行或前30字） ---
    const lines = text.trim().split(/[\n\r]+/);
    const firstLine = lines[0].trim();
    result.title = firstLine.length > 40 ? firstLine.slice(0,40) + '…' : firstLine;
    result.summary = text.trim().length > 200 ? text.trim().slice(0,200) + '…' : text.trim();

    // --- 检测截止日期 ---
    // --- 提取日期（区分截止日期和事件日期） ---
    const dates = this._extractDates(text);
    result.deadline = dates.deadline;
    result.eventDate = dates.eventDate;

    // --- 计算各类别得分 ---
    const todoScore = this._todoScore(text);
    const knowledgeScore = this._knowledgeScore(text);
    const hasDate = result.deadline !== null || result.eventDate !== null;

    // --- 智能分发逻辑 ---
    // 知识：知识得分高，且不被待办得分压倒（避免"复习傅里叶变换"误判）
    if (knowledgeScore >= 2 && knowledgeScore > todoScore) {
      result.categories.push('knowledge');
      result.tags.push(...this._extractKnowledgeTags(text));
    }

    // 待办：待办得分高，或者有明显动作意图
    if (todoScore >= 2 && todoScore >= knowledgeScore) {
      result.categories.push('todo');
    }

    // 日历：有日期（截止日期或事件日期都算）
    if (hasDate) {
      result.categories.push('calendar');
    }

    // 如果什么都没匹配，默认归入收件箱
    if (result.categories.length === 0) {
      result.categories.push('inbox');
    }

    // 去重
    result.categories = [...new Set(result.categories)];
    result.tags = [...new Set(result.tags)];

    return result;
  },

  /**
   * 提取日期，区分「截止日期」和「事件日期」
   * - deadline: 带"前"/"之前"/"截止"/"ddl"等压力词 → 必须在此日期前完成
   * - eventDate: 不带压力词 → 某件事在当天发生
   * 返回 { deadline: Date|null, eventDate: Date|null }
   */
  _extractDates(text) {
    const now = new Date();
    const year = now.getFullYear();
    const weekMap = { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0 };

    // 判断是否带有截止压力
    const hasDeadlinePressure = /(?:前|之前|截止|ddl|deadline|到期|不晚于|最晚|在此之前|到期日)/i.test(text);

    let date = null;

    // "12月15日" / "12月15号"
    let m = text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/);
    if (m) {
      const month = parseInt(m[1]) - 1;
      const day = parseInt(m[2]);
      date = new Date(year, month, day);
      if (date < new Date(year, now.getMonth(), now.getDate() - 1)) {
        date.setFullYear(year + 1);
      }
    }

    // "明天"
    if (!date && /明天/.test(text)) {
      date = new Date(now);
      date.setDate(date.getDate() + 1);
    }

    // "后天"
    if (!date && /后天/.test(text)) {
      date = new Date(now);
      date.setDate(date.getDate() + 2);
    }

    // "大后天"
    if (!date && /大后天/.test(text)) {
      date = new Date(now);
      date.setDate(date.getDate() + 3);
    }

    // "下周X"
    if (!date) {
      m = text.match(/下周\s*([一二三四五六日天])/);
      if (m) {
        const targetDay = weekMap[m[1]];
        date = new Date(now);
        const daysUntil = (7 - now.getDay()) + targetDay;
        date.setDate(date.getDate() + (daysUntil <= 7 ? daysUntil : daysUntil));
      }
    }

    // "下个月X号/日"
    if (!date) {
      m = text.match(/下个?月\s*(\d{1,2})\s*[日号]/);
      if (m) {
        date = new Date(year, now.getMonth() + 1, parseInt(m[1]));
      }
    }

    // "周X"（本周）
    if (!date) {
      m = text.match(/周\s*([一二三四五六日天])/);
      if (m) {
        const targetDay = weekMap[m[1]];
        date = new Date(now);
        let daysUntil = targetDay - now.getDay();
        if (daysUntil <= 0) daysUntil += 7;
        date.setDate(date.getDate() + daysUntil);
      }
    }

    // 截止词 + 附近数字日期
    if (!date && /截止|ddl|deadline|到期/gi.test(text)) {
      m = text.match(/(\d{1,2})[\./-](\d{1,2})/);
      if (m) {
        const month = parseInt(m[1]) - 1;
        const day = parseInt(m[2]);
        date = new Date(year, month, day);
        if (date < new Date(year, now.getMonth(), now.getDate() - 1)) {
          date.setFullYear(year + 1);
        }
      }
    }

    if (!date) return { deadline: null, eventDate: null };

    // 根据压力词决定日期类型
    return {
      deadline: hasDeadlinePressure ? date : null,
      eventDate: hasDeadlinePressure ? null : date,
    };
  },

  /**
   * 待办事项得分（改为评分制，每条命中 +1）
   */
  _todoScore(text) {
    let score = 0;
    const patterns = [
      // 强动作信号（直接指向具体任务 +2 分）
      { re: /交\s*(作业|报告|材料|表|论文|总结|上去|了)/, weight: 2 },
      { re: /提交/, weight: 2 },
      { re: /完成/, weight: 2 },
      { re: /打印/, weight: 2 },
      { re: /报名/, weight: 2 },
      { re: /签到/, weight: 2 },
      { re: /预约/, weight: 2 },
      { re: /别忘了/, weight: 2 },
      { re: /记得\s*(去|要|交|做|写|提交|完成|买|拿|带)/, weight: 2 },
      { re: /(必须|得|要|需要)\s*(交|做|写|提交|完成|去|买|拿|办|处理|改|调整|优化|修|换|fix|喝|吃|扔|丢|倒|洗)/, weight: 2 },
      { re: /(必须|得|要|需要)\s*\S{1,3}?(掉|完|了|一下)/, weight: 2 },  // "得喝掉"、"要扔掉"

      // 中等动作信号 +1 分

  /**
   * 格式化日期为中文
   */
  formatDate(date) {
    if (!date) return '';
    const y = date.getFullYear();
    const m = date.getMonth() + 1;
    const d = date.getDate();
    const week = ['日','一','二','三','四','五','六'][date.getDay()];
    return `${y}年${m}月${d}日 周${week}`;
  },

  /**
   * 判断日期是否临近/过期
   */
  dateUrgency(date) {
    if (!date) return null;
    const now = new Date();
    now.setHours(0,0,0,0);
    const target = new Date(date);
    target.setHours(0,0,0,0);
    const diff = (target - now) / (1000*60*60*24);
    if (diff < 0) return 'overdue';   // 已过期
    if (diff <= 2) return 'soon';     // 2天内
    if (diff <= 7) return 'week';     // 一周内
    return 'ok';
  }
};

    this.renderKnowledge();
    this.renderTrash();
  },

  /** 收件箱 —— 显示全部条目 */
  renderInbox() {
    const panel = this._el('panel-inbox');
    // 收件箱只显示「未分类」的条目——已经被分到待办/日历/知识的条目不出现在这里
    const items = DB.getAll().filter(i => {
      const cats = (i.categories || []);
      return cats.length === 0 || (cats.length === 1 && cats[0] === 'inbox');
    });

    if (items.length === 0) {
      panel.innerHTML = `
        <div class="empty-state">
          <span class="empty-icon">📥</span>
          <p>收件箱是空的</p>
          <p style="font-size:12px;margin-top:4px">所有条目都已分类 👍</p>
        </div>`;
      return;
    }

    panel.innerHTML = items.map(item => this._renderCard(item)).join('');
    this._bindCardEvents(panel);
  },

  /** 待办清单 */
  renderTodo() {
    const panel = this._el('panel-todo');
    const items = DB.getAll().filter(i => (i.categories || []).includes('todo'));

    if (items.length === 0) {
      panel.innerHTML = `
        <div class="empty-state">
          <span class="empty-icon">✅</span>
          <p>暂无待办事项</p>
          <p style="font-size:12px;margin-top:4px">试试输入「明天交综测材料」或「记得去拿快递」</p>
        </div>`;
      return;
    }

    // 未完成在前，已完成在后
    const active = items.filter(i => !i.done);
    const done = items.filter(i => i.done);
    const sorted = [...active, ...done];

    panel.innerHTML = sorted.map(item => this._renderCard(item, true)).join('');
    this._bindCardEvents(panel);
  },

  /** 日历视图 */
  renderCalendar() {
    const panel = this._el('panel-calendar');
    const calItems = DB.getAll().filter(i =>
      (i.categories || []).includes('calendar') && (i.deadline || i.eventDate)
    );

    // 按日期分组（截止日期和事件日期都算）
    const dateMap = {};
    calItems.forEach(item => {
      // 事件日期和截止日期都可能存在
      const dates = [];
      if (item.deadline) dates.push(item.deadline);
      if (item.eventDate) dates.push(item.eventDate);
      dates.forEach(key => {
        if (!dateMap[key]) dateMap[key] = [];
        dateMap[key].push(item);
      });
    });

    const now = new Date();
    const [year, month] = this._calYearMonth;
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startPad = firstDay.getDay(); // 周日=0
    const daysInMonth = lastDay.getDate();

    // 月份导航
    const monthLabel = `${year}年 ${month + 1}月`;
    const dayHeaders = ['日','一','二','三','四','五','六'];

    // 生成日期格子
    let cells = '';
    // 填充上月尾巴
    for (let i = 0; i < startPad; i++) {
      cells += `<div class="day-cell other-month"></div>`;
    }
    // 本月日期
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(year, month, d);
      const isoStr = date.toISOString().split('T')[0];
      const todayStr = now.toISOString().split('T')[0];
      const isToday = isoStr === todayStr;
      const hasItems = dateMap[isoStr] && dateMap[isoStr].length > 0;
      const isSelected = this._calSelectedDate === isoStr;

      let cls = 'day-cell';
      if (isToday) cls += ' today';
      if (hasItems) cls += ' has-items';
      if (isSelected) cls += ' selected';

      cells += `<div class="${cls}" data-date="${isoStr}">${d}</div>`;
    }

    // 选中日期的条目
    let dateItemsHtml = '';
    if (this._calSelectedDate && dateMap[this._calSelectedDate]) {
      const items = dateMap[this._calSelectedDate];
      dateItemsHtml = `
        <div class="date-items-list">
          <h3>📌 ${this._calSelectedDate} 的事项 (${items.length})</h3>
          ${items.map(item => this._renderCard(item)).join('')}
        </div>`;
    } else if (this._calSelectedDate) {
      dateItemsHtml = `
        <div class="date-items-list">
          <h3>📌 ${this._calSelectedDate}</h3>
          <p style="color:var(--text3);font-size:13px">当天没有待办事项</p>
        </div>`;
    }

    // 近期事项汇总（截止日期 + 事件日期）
    const upcoming = calItems
      .filter(i => {
        const d = i.deadline || i.eventDate;
        if (!d || i.done) return false;
        const diff = (new Date(d) - now) / (1000*60*60*24);
        return diff >= -1 && diff <= 14;
      })
      .sort((a, b) => new Date(a.deadline || a.eventDate) - new Date(b.deadline || b.eventDate));

    let upcomingHtml = '';
    if (upcoming.length > 0) {
      upcomingHtml = `
        <div class="date-items-list" style="margin-top:20px">
          <h3>📌 近期事项 (${upcoming.length})</h3>
          ${upcoming.map(item => this._renderCard(item)).join('')}
        </div>`;
    }

    panel.innerHTML = `
      <div class="calendar-nav">
        <button id="calPrev">◀</button>
        <span class="month-label">${monthLabel}</span>
        <button id="calNext">▶</button>
      </div>
      <div class="calendar-grid">
        ${dayHeaders.map(h => `<div class="day-header">${h}</div>`).join('')}
        ${cells}
      </div>
      ${dateItemsHtml}
      ${upcomingHtml}
    `;

    // 绑定日历事件
    panel.querySelector('#calPrev')?.addEventListener('click', () => {
      if (this._calYearMonth[1] === 0) {
        this._calYearMonth = [this._calYearMonth[0] - 1, 11];
      } else {
        this._calYearMonth = [this._calYearMonth[0], this._calYearMonth[1] - 1];
      }
      this._calSelectedDate = null;
      this.renderCalendar();
    });

    panel.querySelector('#calNext')?.addEventListener('click', () => {
      if (this._calYearMonth[1] === 11) {
        this._calYearMonth = [this._calYearMonth[0] + 1, 0];
      } else {
        this._calYearMonth = [this._calYearMonth[0], this._calYearMonth[1] + 1];
      }
      this._calSelectedDate = null;
      this.renderCalendar();
    });

    panel.querySelectorAll('.day-cell.has-items, .day-cell:not(.other-month)').forEach(cell => {
      cell.addEventListener('click', () => {
        const date = cell.dataset.date;
        if (date) {
          this._calSelectedDate = date;
          this.renderCalendar();
        }
      });
    });

    this._bindCardEvents(panel);
  },

  /** 知识卡片 */
  renderKnowledge() {
    const panel = this._el('panel-knowledge');
    const items = DB.getAll().filter(i => (i.categories || []).includes('knowledge'));

    if (items.length === 0) {
      panel.innerHTML = `
        <div class="empty-state">
          <span class="empty-icon">📚</span>
          <p>暂无知识卡片</p>
          <p style="font-size:12px;margin-top:4px">试试输入「能带理论的核心是布里渊区…」或粘贴一段论文摘要</p>
        </div>`;
      return;
    }

    panel.innerHTML = items.map(item => this._renderCard(item, false, true)).join('');
    this._bindCardEvents(panel);
  },

  /** 回收站 */
  renderTrash() {
    const panel = this._el('panel-trash');
    const trashItems = TrashDB.getAll();
    const MS_7_DAYS = 7 * 24 * 60 * 60 * 1000;
    const now = Date.now();

    if (trashItems.length === 0) {
      panel.innerHTML = `
        <div class="empty-state">
          <span class="empty-icon">🗑️</span>
          <p>回收站是空的</p>
        </div>`;
      return;
    }

    panel.innerHTML = trashItems.map(item => {
      const deletedTime = new Date(item.deletedAt).getTime();
      const remaining = MS_7_DAYS - (now - deletedTime);
      const daysLeft = Math.max(0, Math.ceil(remaining / (24 * 60 * 60 * 1000)));
      const timeStr = new Date(item.deletedAt).toLocaleString('zh-CN', {
        month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'
      });
      const originalCats = (item.categories || []).filter(c => c !== 'inbox').join(' · ') || '未分类';

      return `
        <div class="card" style="opacity:0.75;">
          <div class="card-header">
            <span class="card-title">${this._escape(item.title || '无标题')}</span>
            <span style="font-size:11px;color:var(--text3);">删除于 ${timeStr}</span>
          </div>
          <div class="card-meta">
            <span style="font-size:11px;color:var(--text2);">原分类: ${originalCats}</span>
            <span style="font-size:11px;color:${daysLeft <= 1 ? 'var(--danger)' : 'var(--text3)'};">
              ⏳ ${daysLeft}天后自动清除
            </span>
          </div>
          <div class="card-actions">
            <button class="btn btn-primary btn-sm trash-restore" data-id="${item.id}">↩️ 恢复</button>
            <button class="btn btn-ghost btn-sm trash-delete" data-id="${item.id}" style="color:var(--danger);">彻底删除</button>
          </div>
        </div>`;
    }).join('');

    // 恢复按钮
    panel.querySelectorAll('.trash-restore').forEach(btn => {
      btn.addEventListener('click', () => {
        const restored = TrashDB.restore(btn.dataset.id);
        if (restored) {
          DB.add(restored);
          UI._showToast('✅ 已恢复');
          UI.renderAll();
        }
      });
    });

    // 彻底删除按钮
    panel.querySelectorAll('.trash-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        const ok = await showConfirm('彻底删除', '此操作不可撤销，确认彻底删除？', '⚠️', '彻底删除');
        if (ok) {
          TrashDB.removeForever(btn.dataset.id);
          UI._showToast('已彻底删除');
          UI.renderAll();
        }
      });
    });

    // 清空回收站
    const emptyBtn = document.createElement('button');
    emptyBtn.className = 'btn btn-ghost btn-sm';
    emptyBtn.style.cssText = 'margin-top:12px;color:var(--danger);width:100%;';
    emptyBtn.textContent = '🗑️ 清空回收站';
    emptyBtn.addEventListener('click', async () => {
      const ok = await showConfirm('清空回收站', '将彻底删除回收站中所有条目，不可恢复。', '⚠️', '全部清空');
      if (ok) {
        TrashDB.emptyAll();
        UI._showToast('回收站已清空');
        UI.renderAll();
      }
    });

    const btnWrap = document.createElement('div');
    btnWrap.style.cssText = 'text-align:center;';
    btnWrap.appendChild(emptyBtn);
    panel.appendChild(btnWrap);
  },

  /** 更新所有计数（含回收站） */
  updateCounts() {
    const items = DB.getAll();
    let cInbox = 0, cTodo = 0, cCal = 0, cKnow = 0;

    items.forEach(item => {
      const cats = item.categories || [];
      // 收件箱计数：只算纯未分类的
      if (cats.length === 0 || (cats.length === 1 && cats[0] === 'inbox')) cInbox++;
      if (cats.includes('todo')) cTodo++;
      if (cats.includes('calendar')) cCal++;
      if (cats.includes('knowledge')) cKnow++;
    });

    this._el('countInbox').textContent = cInbox;
    this._el('countTodo').textContent = cTodo;
    this._el('countCalendar').textContent = cCal;
    this._el('countKnowledge').textContent = cKnow;

    // 回收站计数
    const trashCount = TrashDB.getAll().length;
    this._el('trashHint').textContent = trashCount > 0 ? `(${trashCount})` : '';
  },

  /**
   * 渲染单张卡片
   */
  _renderCard(item, showCheckbox = false, isKnowledge = false) {
    const cats = item.categories || [];
    const isTodo = cats.includes('todo');
    const isCal = cats.includes('calendar');
    const isKnow = cats.includes('knowledge');

    let borderClass = 'inbox-card';
    if (isKnow || isKnowledge) borderClass = 'knowledge-card';
    else if (isTodo) borderClass = 'todo-card';

    const doneClass = item.done ? ' completed' : '';

    // 日期显示：区分截止日期（⏰）和事件日期（📅）
    let dateHtml = '';
    if (item.deadline) {
      const urgency = Brain.dateUrgency(item.deadline);
      const dateLabel = Brain.formatDate(new Date(item.deadline));
      let urgencyClass = '';
      if (urgency === 'overdue') urgencyClass = '';
      else if (urgency === 'soon') urgencyClass = 'soon';
      else urgencyClass = 'ok';
      dateHtml += `<span class="date-badge ${urgencyClass}">⏰ 截止: ${dateLabel}</span>`;
    }
    if (item.eventDate) {
      const dateLabel = Brain.formatDate(new Date(item.eventDate));
      dateHtml += `<span class="date-badge ok">📅 ${dateLabel}</span>`;
    }

    // 分类徽章
    let badgesHtml = cats.map(cat => {
      if (cat === 'todo') return '<span class="badge badge-todo">待办</span>';
      if (cat === 'calendar') return '<span class="badge badge-calendar">日历</span>';
      if (cat === 'knowledge') return '<span class="badge badge-knowledge">知识</span>';
      return '<span class="badge badge-inbox">收件</span>';
    }).join('');

    // 知识标签
    if (item.tags && item.tags.length > 0) {
      badgesHtml += item.tags.map(t => `<span class="badge badge-knowledge">${t}</span>`).join('');
    }

    // 缩略图
    let imgHtml = '';
    if (item.image) {
      imgHtml = `<img src="${item.image}" style="max-width:100%;max-height:160px;border-radius:8px;margin-top:8px;display:block;">`;
    }

    // 正文（截断）
    const bodyText = item.summary || item.content || '';
    const isLong = bodyText.length > 150;
    const displayText = isLong ? bodyText.slice(0, 150) + '…' : bodyText;

    const timeStr = new Date(item.createdAt).toLocaleString('zh-CN', {
      month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'
    });

    const checkboxHtml = (showCheckbox || isTodo)
      ? `<input type="checkbox" class="card-checkbox" data-id="${item.id}" ${item.done ? 'checked' : ''}
          style="width:20px;height:20px;cursor:pointer;accent-color:var(--todo);flex-shrink:0;margin-top:2px">`
      : '';

    return `
      <div class="card ${borderClass}${doneClass}" data-id="${item.id}">
        <div class="card-header">
          ${checkboxHtml}
          <span class="card-title" data-id="${item.id}" title="点击编辑标题">${this._escape(item.title || '无标题')}</span>
          <button class="btn btn-ghost btn-sm card-delete" data-id="${item.id}" title="删除">🗑</button>
        </div>
        ${badgesHtml ? `<div class="card-meta">${badgesHtml}${dateHtml}</div>` : ''}
        ${bodyText ? `<div class="card-body" data-id="${item.id}">${this._escape(displayText)}</div>` : ''}
        ${isLong ? `<span class="card-body-toggle" data-id="${item.id}">展开全部 ↓</span>` : ''}
        ${imgHtml}
        <div class="card-time">${timeStr}${item.aiClassified ? ' · 🤖 AI' : ''}</div>
      </div>`;
  },

  _escape(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  },

  /** 绑定卡片事件（checkbox、删除、展开、标题编辑） */
  _bindCardEvents(panel) {
    // --- 标题点击编辑 ---
    panel.querySelectorAll('.card-title').forEach(titleEl => {
      titleEl.addEventListener('click', () => {
        if (titleEl.classList.contains('editing')) return;
        const itemId = titleEl.dataset.id;
        const item = DB.getAll().find(i => i.id === itemId);
        if (!item) return;

        // 替换为 input
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'card-title-input';
        input.value = item.title || '';
        input.placeholder = '输入标题…';
        titleEl.replaceWith(input);
        input.focus();
        input.select();

        const save = () => {
          const newTitle = input.value.trim() || '无标题';
          DB.update(itemId, { title: newTitle });
          input.replaceWith(titleEl);
          titleEl.textContent = newTitle;
          titleEl.classList.remove('editing');
        };

        input.addEventListener('blur', save);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
          if (e.key === 'Escape') { input.value = item.title || ''; input.blur(); }
        });
      });
    });
    // Checkbox
    panel.querySelectorAll('.card-checkbox').forEach(cb => {
      cb.addEventListener('change', () => {
        DB.update(cb.dataset.id, { done: cb.checked });
        UI.renderAll();
      });
    });

    // 删除按钮
    panel.querySelectorAll('.card-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        const items = DB.getAll();
        const item = items.find(i => i.id === btn.dataset.id);
        if (!item) return;
        const ok = await showConfirm('移到回收站', `「${item.title || '无标题'}」将在回收站保留7天，可随时恢复。`, '🗑️', '移入回收站');
        if (ok) {
          TrashDB.moveIn(item);
          DB.remove(btn.dataset.id);
          UI.renderAll();
          UI._showToast('已移入回收站 🗑️');
        }
      });
    });

    // 展开/收起
    panel.querySelectorAll('.card-body-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const body = panel.querySelector(`.card-body[data-id="${toggle.dataset.id}"]`);
        if (body) {
          const item = DB.getAll().find(i => i.id === toggle.dataset.id);
          if (body.classList.contains('expanded')) {
            body.classList.remove('expanded');
            toggle.textContent = '展开全部 ↓';
            if (item) body.textContent = (item.summary || item.content || '').slice(0,150) + '…';
          } else {
            body.classList.add('expanded');
            toggle.textContent = '收起 ↑';
            if (item) body.textContent = item.summary || item.content || '';
          }
        }
      });
    });
  },

  /** Toast 消息 */
  _showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  },

  // ---- 日历状态 ----
  _calYearMonth: [new Date().getFullYear(), new Date().getMonth()],
  _calSelectedDate: null,
};

/* ============================================
   应用控制器
   ============================================ */
const App = {
  _pendingImage: null, // base64 图片数据

  init() {
    // 首次访问时插入示例数据
    if (!localStorage.getItem(DB.KEY)) {
      this._seedData();
    }

    UI.renderAll();
    UI._calYearMonth = [new Date().getFullYear(), new Date().getMonth()];

    // --- 事件绑定 ---
    const inputText = UI._el('inputText');
    const submitBtn = UI._el('submitBtn');
    const uploadBtn = UI._el('uploadBtn');
    const imageInput = UI._el('imageInput');
    const imgRemove = UI._el('imgRemove');

    // 提交
    submitBtn.addEventListener('click', () => this._handleSubmit());
    inputText.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        this._handleSubmit();
      }
    });

    // 实时预览分类（输入时）
    let classifyTimer;
    inputText.addEventListener('input', () => {
      const text = inputText.value;
      const aiHint = Settings.isAIReady() ? ' · 🤖 AI' : '';
      UI._el('charHint').textContent = text.length > 0
        ? `${text.length} 字 · Ctrl+Enter 提交${aiHint}`
        : `Ctrl + Enter 快速提交${aiHint}`;

      // 防抖后显示分类预览
      clearTimeout(classifyTimer);
      if (text.trim().length > 3) {
        classifyTimer = setTimeout(() => this._previewClassify(text), 400);
      } else {
        UI._el('classifyPreview').classList.remove('active');
      }
    });

    // 图片上传
    uploadBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      this._resizeImage(file, (dataUrl) => {
        this._pendingImage = dataUrl;
        UI._el('imgPreview').src = dataUrl;
        UI._el('imgPreviewWrap').style.display = 'inline-block';
        // 如果输入框为空，自动填占位文字
        if (!inputText.value.trim()) {
          inputText.value = '[图片] ';
          inputText.focus();
        }
      });
    });

    imgRemove.addEventListener('click', () => {
      this._pendingImage = null;
      UI._el('imgPreviewWrap').style.display = 'none';
      UI._el('imgPreview').src = '';
      imageInput.value = '';
      if (inputText.value === '[图片] ') {
        inputText.value = '';
      }
    });

    // 标签栏切换
    UI._el('tabBar').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      const tab = btn.dataset.tab;

      // 激活标签样式
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // 切换面板
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      UI._el(`panel-${tab}`).classList.add('active');

      // 切到日历时刷新
      if (tab === 'calendar') {
        UI._calYearMonth = [new Date().getFullYear(), new Date().getMonth()];
        UI._calSelectedDate = null;
        UI.renderCalendar();
      }
    });

    // --- 回收站按钮 ---
    UI._el('btnTrash').addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      UI._el('panel-trash').classList.add('active');
      UI.renderTrash();
    });

    // --- 启动时清理过期回收站条目 ---
    const cleaned = TrashDB.cleanExpired();
    if (cleaned > 0) console.log(`回收站清理: ${cleaned} 条过期`);

    // --- 每日0点定时清理 ---
    this._scheduleMidnightCleanup();

    // --- 设置面板事件绑定 ---
    this._initSettings();
    this._updateAIStatusBar();
  },

  /** 每日0点清理回收站过期条目 */
  _scheduleMidnightCleanup() {
    const msUntilMidnight = () => {
      const now = new Date();
      const midnight = new Date(now);
      midnight.setHours(24, 0, 0, 0);
      return midnight - now;
    };

    const runCleanup = () => {
      const cleaned = TrashDB.cleanExpired();
      if (cleaned > 0) {
        console.log(`[${new Date().toLocaleString()}] 回收站自动清理: ${cleaned} 条过期`);
      }
      // 递归调度下一个0点
      setTimeout(runCleanup, msUntilMidnight() + 1000);
    };

    // 等到下一个0点
    setTimeout(runCleanup, msUntilMidnight() + 1000);
  },

  /** 初始化设置面板 */
  _initSettings() {
    const overlay = UI._el('settingsOverlay');
    const btnSettings = UI._el('btnSettings');
    const btnClose = UI._el('settingsClose');
    const toggleAI = UI._el('toggleAI');
    const btnSave = UI._el('btnSaveSettings');
    const btnTest = UI._el('btnTestAPI');
    const providerSelect = UI._el('aiProvider');
    const modelSelect = UI._el('aiModel');

    // 打开设置
    btnSettings.addEventListener('click', () => {
      this._loadSettingsToForm();
      overlay.classList.add('show');
    });

    // 关闭设置
    const closeSettings = () => overlay.classList.remove('show');
    btnClose.addEventListener('click', closeSettings);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeSettings();
    });

    // AI 开关
    toggleAI.addEventListener('click', () => {
      toggleAI.classList.toggle('on');
    });

    // 填充提供商下拉
    const providerKeys = Object.keys(PROVIDERS);
    providerSelect.innerHTML = providerKeys.map(k =>
      `<option value="${k}">${PROVIDERS[k].name}</option>`
    ).join('');

    // 提供商切换 → 更新模型下拉
    const updateModelSelect = () => {
      const p = PROVIDERS[providerSelect.value];
      if (!p) return;
      modelSelect.innerHTML = p.models.map(m =>
        `<option value="${m.val}">${m.label}</option>`
      ).join('');
    };
    providerSelect.addEventListener('change', updateModelSelect);

    // 测试连接
    btnTest.addEventListener('click', async () => {
      // 先临时保存当前设置
      this._saveFormToSettings();
      btnTest.textContent = '⏳ 测试中…';
      btnTest.disabled = true;

      const result = await AIClassifier.testConnection();

      btnTest.textContent = '🔍 测试连接';
      btnTest.disabled = false;

      if (result.ok) {
        UI._showToast('✅ 连接成功！AI 分类已就绪');
      } else {
        UI._showToast(`❌ 连接失败：${result.error}`);
      }
    });

    // 保存设置
    btnSave.addEventListener('click', () => {
      this._saveFormToSettings();
      this._updateAIStatusBar();
      closeSettings();
      UI._showToast(Settings.isAIReady() ? '✅ AI 分类已启用' : '💾 设置已保存（AI 未启用）');
    });

    // ESC 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('show')) {
        closeSettings();
      }
    });
  },

  /** 加载设置到表单 */
  _loadSettingsToForm() {
    const s = Settings.getAll();
    UI._el('toggleAI').classList.toggle('on', s.aiEnabled);
    UI._el('aiProvider').value = s.provider;
    UI._el('aiApiKey').value = s.apiKey;
    UI._el('aiModel').value = s.model;
    // 触发 provider change 以更新模型列表
    UI._el('aiProvider').dispatchEvent(new Event('change'));
  },

  /** 保存表单到设置 */
  _saveFormToSettings() {
    Settings.setAll({
      aiEnabled: UI._el('toggleAI').classList.contains('on'),
      provider: UI._el('aiProvider').value,
      apiKey: UI._el('aiApiKey').value.trim(),
      model: UI._el('aiModel').value,
    });
  },

  /** 更新顶部 AI 状态栏 */
  _updateAIStatusBar() {
    const bar = UI._el('aiStatusBar');
    const text = UI._el('aiStatusText');
    const dot = UI._el('aiDot');

    if (Settings.isAIReady()) {
      bar.className = 'ai-status-bar online';
      const provider = Settings.get('provider');
      const model = Settings.get('model');
      const shortModel = model.length > 25 ? model.slice(0, 25) + '…' : model;
      text.textContent = `🤖 AI 分类 · ${provider === 'anthropic' ? 'Claude' : provider === 'openai' ? 'GPT' : '自定义'} · ${shortModel}`;
      dot.classList.add('active');
    } else {
      bar.className = 'ai-status-bar offline';
      text.textContent = '📋 本地规则引擎';
      dot.classList.remove('active');
    }
  },

  /** 分类预览（输入时实时显示） */
  _previewClassify(text) {
    const result = Brain.analyze(text);
    const container = UI._el('classifyPreview');
    container.innerHTML = '';

    if (result.categories.length === 0 || (result.categories.length === 1 && result.categories[0] === 'inbox')) {
      container.innerHTML = '<span class="badge badge-inbox">📥 收件箱</span>';
      container.classList.add('active');
      return;
    }

    let html = '';
    if (result.categories.includes('todo')) html += '<span class="badge badge-todo">✅ 待办</span>';
    if (result.categories.includes('calendar')) html += '<span class="badge badge-calendar">📅 日历</span>';
    if (result.categories.includes('knowledge')) html += '<span class="badge badge-knowledge">📚 知识</span>';
    if (result.deadline) {
      html += `<span class="badge badge-calendar">截止: ${Brain.formatDate(result.deadline)}</span>`;
    }
    container.innerHTML = html;
    container.classList.add('active');
  },

  /** 核心：提交处理（本地优先，AI 兜底） */
  async _handleSubmit() {
    const inputText = UI._el('inputText');
    const text = inputText.value.trim();
    if (!text && !this._pendingImage) return;

    const processing = UI._el('processing');

    // --- 第一步：本地引擎先分类 ---
    let analysis = Brain.analyze(text);
    let usedAI = false;
    const isUnclassified = !analysis.categories
      || analysis.categories.length === 0
      || (analysis.categories.length === 1 && analysis.categories[0] === 'inbox');

    // --- 第二步：本地无法分类时，交给 AI ---
    if (isUnclassified && Settings.isAIReady()) {
      processing.innerHTML = '<span>🤖 本地无法识别，交给 AI…</span><span class="dot-pulse"><span></span><span></span><span></span></span>';
      processing.classList.add('active');

      const aiResult = await AIClassifier.classify(text);
      processing.classList.remove('active');

      if (aiResult) {
        usedAI = true;
        analysis = {
          categories: aiResult.categories,
          title: aiResult.title,
          deadline: aiResult.deadline ? new Date(aiResult.deadline + 'T00:00:00') : null,
          eventDate: aiResult.eventDate ? new Date(aiResult.eventDate + 'T00:00:00') : null,
          tags: aiResult.tags,
          summary: aiResult.summary,
        };
      }
    }

    // 显示处理动画（本地模式）
    if (!usedAI) {
      processing.innerHTML = '<span>🧠 智能识别中</span><span class="dot-pulse"><span></span><span></span><span></span></span>';
      processing.classList.add('active');
      await this._sleep(300); // 短暂动画
    }

    // 如果没有内容但有图片，至少归入收件箱
    if (!analysis.categories || analysis.categories.length === 0) {
      analysis.categories = ['inbox'];
    }

    // 构建条目
    const item = {
      id: this._generateId(),
      content: text,
      image: this._pendingImage || null,
      title: analysis.title || (this._pendingImage ? '图片' : '无标题'),
      summary: analysis.summary,
      categories: analysis.categories,
      deadline: analysis.deadline ? (
        analysis.deadline instanceof Date
          ? analysis.deadline.toISOString().split('T')[0]
          : analysis.deadline
      ) : null,
      eventDate: analysis.eventDate ? (
        analysis.eventDate instanceof Date
          ? analysis.eventDate.toISOString().split('T')[0]
          : analysis.eventDate
      ) : null,
      tags: analysis.tags || [],
      done: false,
      aiClassified: usedAI,
      createdAt: new Date().toISOString(),
    };

    // 存入库
    DB.add(item);

    // 清理输入
    inputText.value = '';
    this._pendingImage = null;
    UI._el('imgPreviewWrap').style.display = 'none';
    UI._el('imgPreview').src = '';
    UI._el('imageInput').value = '';
    UI._el('classifyPreview').classList.remove('active');
    UI._el('charHint').textContent = 'Ctrl + Enter 快速提交' + (Settings.isAIReady() ? ' · 🤖 AI' : '');

    // 恢复处理动画默认文字
    processing.innerHTML = '<span>🧠 智能识别中</span><span class="dot-pulse"><span></span><span></span><span></span></span>';
    processing.classList.remove('active');

    // 智能切换到对应标签页
    this._smartSwitchTab(analysis.categories);

    // 刷新所有视图
    UI.renderAll();

    // 反馈
    const labels = [];
    if (analysis.categories.includes('todo')) labels.push('待办清单');
    if (analysis.categories.includes('calendar')) labels.push('日历');
    if (analysis.categories.includes('knowledge')) labels.push('知识卡片');
    if (labels.length === 0 || (labels.length === 1 && analysis.categories.includes('inbox'))) labels.push('收件箱');

    const aiLabel = usedAI ? '🤖 AI' : '📋 本地';
    UI._showToast(`✅ [${aiLabel}] 已分发到：${labels.join('、')}`);

    // 聚焦回输入框
    inputText.focus();
  },

  /** 根据分类结果自动切换标签 */
  _smartSwitchTab(categories) {
    let targetTab = 'inbox';
    // 优先级：待办 > 日历 > 知识 > 收件箱
    if (categories.includes('todo')) targetTab = 'todo';
    else if (categories.includes('calendar')) targetTab = 'calendar';
    else if (categories.includes('knowledge')) targetTab = 'knowledge';

    const btn = document.querySelector(`.tab-btn[data-tab="${targetTab}"]`);
    if (btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      UI._el(`panel-${targetTab}`).classList.add('active');

      if (targetTab === 'calendar') {
        UI._calYearMonth = [new Date().getFullYear(), new Date().getMonth()];
        UI._calSelectedDate = null;
        UI.renderCalendar();
      }
    }
  },

  /** 压缩图片 */
  _resizeImage(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 800;
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * (maxW / w); w = maxW; }

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  },

  _sleep(ms) { return new Promise(r => setTimeout(r, ms)); },

  _generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  },

  /** 示例数据 */
  _seedData() {
    const samples = [
      {
        content: '12月15日前交综测材料，需要打印成绩单和填写申请表',
        analysis: Brain.analyze('12月15日前交综测材料，需要打印成绩单和填写申请表'),
      },
      {

        analysis: Brain.analyze('傅里叶变换可以与拉普拉斯变换相互转换，都是积分变换的特例，在信号处理和控制系统中有广泛应用'),
      },
      {
        content: '记得明天去拿快递，取件码3-2-108，在菜鸟驿站',
        analysis: Brain.analyze('记得明天去拿快递，取件码3-2-108，在菜鸟驿站'),
      },
      {
        content: '半导体物理笔记：能带理论的核心是布里渊区，通过薛定谔方程在周期势场中求解得到电子色散关系 E(k)',
        analysis: Brain.analyze('半导体物理笔记：能带理论的核心是布里渊区，通过薛定谔方程在周期势场中求解得到电子色散关系 E(k)'),
      },
      {
        content: '读到一篇好文章：深度学习在固体物理中的应用——用图神经网络预测材料能带结构 [1]',
        analysis: Brain.analyze('读到一篇好文章：深度学习在固体物理中的应用——用图神经网络预测材料能带结构 [1]'),
      },
      {
        content: '下班前记得回复老板的邮件，确认下周例会时间',
        analysis: Brain.analyze('下班前记得回复老板的邮件，确认下周例会时间'),
      },
    ];

    const now = Date.now();
    samples.forEach((s, i) => {
      const item = {
        id: `seed_${i}`,
        content: s.content,
        image: null,
        title: s.analysis.title,
        summary: s.analysis.summary,
        categories: s.analysis.categories,
        deadline: s.analysis.deadline ? s.analysis.deadline.toISOString().split('T')[0] : null,
        eventDate: s.analysis.eventDate ? s.analysis.eventDate.toISOString().split('T')[0] : null,
        tags: s.analysis.tags,
        done: false,
        createdAt: new Date(now - (samples.length - i) * 3600000).toISOString(),
      };
      DB.add(item);
    });
  },
};

document.addEventListener('DOMContentLoaded', () => App.init());

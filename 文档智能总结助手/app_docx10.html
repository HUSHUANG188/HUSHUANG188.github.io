<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文档智能总结助手（增强最终版）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "YaHei", sans-serif;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        :root {
            --bg: #f4f6fa;
            --card: #fff;
            --text: #334155;
            --text2: #475569;
            --text3: #64748b;
            --border: #e2e8f0;
            --blue: #3b82f6;
            --blue-hover: #2563eb;
            --gray: #94a3b8;
            --light-blue: #eff6ff;
            --preview-bg: #f8fafc;
        }

        [data-theme="dark"] {
            --bg: #1e1e2e;
            --card: #282838;
            --text: #e0e0e0;
            --text2: #c0c0d0;
            --text3: #a0a0b0;
            --border: #3f3f5f;
            --blue: #5b8cf7;
            --blue-hover: #4b7cf7;
            --light-blue: #2a3a5f;
            --preview-bg: #2d2d3f;
        }

        body {
            background: var(--bg);
            color: var(--text);
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 30px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }

        h2 {
            color: var(--text);
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .config-area {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .config-item {
            flex: 1;
            min-width: 200px;
        }

        .config-item label {
            display: block;
            margin-bottom: 5px;
            color: var(--text2);
            font-size: 14px;
        }

        .config-item input, .config-item select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--card);
            color: var(--text);
        }

        .drop-area {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .drop-area.dragover {
            border-color: var(--blue);
            background: var(--light-blue);
        }

        .drop-area p {
            color: var(--text3);
            margin-bottom: 15px;
        }

        .btn {
            background: var(--blue);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background: var(--blue-hover);
        }

        .btn:disabled {
            background: var(--gray);
            cursor: not-allowed;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .card h4 {
            margin-bottom: 12px;
            color: var(--text);
            font-size: 16px;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 10px 0;
            color: var(--text2);
            font-size: 14px;
        }

        .preview {
            background: var(--preview-bg);
            padding: 12px;
            border-radius: 6px;
            max-height: 160px;
            overflow-y: auto;
            font-size: 13px;
            color: var(--text);
            white-space: pre-wrap;
        }

        .summary {
            background: var(--light-blue);
            padding: 15px;
            border-radius: 8px;
            margin: 12px 0;
            border-left: 4px solid var(--blue);
            color: var(--text);
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .copy-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
            gap: 8px;
        }

        .loading {
            color: var(--text3);
            font-style: italic;
        }

        .char-count {
            font-size: 12px;
            color: var(--text3);
            margin-top: 6px;
            text-align: right;
        }

        .keywords {
            margin-top: 8px;
            font-size: 14px;
            color: var(--text);
        }

        .history-panel {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
        }

        .history-item {
            padding: 12px 15px;
            background: var(--preview-bg);
            border-radius: 6px;
            border-left: 3px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            background: var(--light-blue);
        }

        .history-item.active {
            border-left-color: var(--blue);
            background: var(--light-blue);
        }

        .history-item .name {
            font-weight: 500;
            color: var(--text);
        }

        .history-item .time {
            font-size: 12px;
            color: var(--text3);
            margin-top: 4px;
        }

        .history-item .del {
            color: #ef4444;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }

        .empty-history {
            text-align: center;
            color: var(--text3);
            padding: 20px;
        }

        .full-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
            display: none;
        }

        .full-box {
            background: var(--card);
            width: 90%; max-width: 800px;
            max-height: 80vh;
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
        }

        .full-box h3 {
            margin-bottom: 12px;
        }

        .full-content {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
        }

        .close-btn {
            margin-top: 12px;
            background: var(--border);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .compare-panel {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .compare-boxes {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .compare-box {
            flex: 1;
        }

        .compare-drop {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .compare-drop.dragover {
            border-color: var(--blue);
            background: var(--light-blue);
        }

        .theme-switch {
            background: var(--preview-bg);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h2>📄 文档智能总结助手</h2>
            <div style="display:flex;gap:10px">
                <button class="btn btn-sm" id="clearHistoryBtn">清空历史记录</button>
                <button class="theme-switch" id="themeBtn">深色/浅色</button>
            </div>
        </div>

        <div class="config-area">
            <div class="config-item">
                <label>总结字数限制：</label>
                <input type="number" id="wordLimit" value="300" min="50" max="500">
            </div>
            <div class="config-item">
                <label>总结风格：</label>
                <select id="summaryStyle">
                    <option value="concise">简洁要点</option>
                    <option value="detailed">详细展开</option>
                    <option value="creative">创意重述</option>
                </select>
            </div>
        </div>

        <div class="drop-area" id="dropArea">
            <p>拖拽 DOCX / TXT 文件到此处</p>
            <button class="btn" id="selectBtn">选择文件</button>
        </div>

        <div id="results"></div>

        <div class="history-panel">
            <div class="history-header">
                <h3>📜 历史记录</h3>
                <span style="font-size:13px;color:var(--text3)">本地自动保存</span>
            </div>
            <div id="historyList" class="history-list"></div>
        </div>

        <div class="compare-panel">
            <h3>📝 文档对比</h3>
            <div class="compare-boxes">
                <div class="compare-box">
                    <div class="compare-drop" id="compareDrop1">
                        <p>拖拽或点击选择文档1</p>
                        <button class="btn btn-sm" id="compareSelect1">选择文件</button>
                    </div>
                </div>
                <div class="compare-box">
                    <div class="compare-drop" id="compareDrop2">
                        <p>拖拽或点击选择文档2</p>
                        <button class="btn btn-sm" id="compareSelect2">选择文件</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="full-modal" id="fullModal">
        <div class="full-box">
            <h3 id="fullTitle">全文</h3>
            <div class="full-content" id="fullContent"></div>
            <button class="close-btn" id="closeFull">关闭</button>
        </div>
    </div>

    <script src="https://unpkg.com/mammoth@1.4.18/mammoth.browser.min.js"></script>
    <script>
        const DEEPSEEK_API_KEY = "yours API key";
        const DEEPSEEK_URL = "https://api.deepseek.com/chat/completions";
        const MODEL_NAME = "deepseek-chat";

        const wordLimitInput = document.getElementById("wordLimit");
        const styleSelect = document.getElementById("summaryStyle");
        const dropArea = document.getElementById("dropArea");
        const selectBtn = document.getElementById("selectBtn");
        const resultsDiv = document.getElementById("results");
        const historyList = document.getElementById("historyList");
        const clearHistoryBtn = document.getElementById("clearHistoryBtn");
        const themeBtn = document.getElementById("themeBtn");
        const fullModal = document.getElementById("fullModal");
        const fullContent = document.getElementById("fullContent");
        const fullTitle = document.getElementById("fullTitle");
        const closeFull = document.getElementById("closeFull");

        const compareDrop1 = document.getElementById("compareDrop1");
        const compareDrop2 = document.getElementById("compareDrop2");
        const compareSelect1 = document.getElementById("compareSelect1");
        const compareSelect2 = document.getElementById("compareSelect2");

        let currentFullText = "";

        themeBtn.addEventListener("click", () => {
            const now = document.documentElement.getAttribute("data-theme");
            if (now === "dark") {
                document.documentElement.removeAttribute("data-theme");
                localStorage.setItem("theme", "light");
            } else {
                document.documentElement.setAttribute("data-theme", "dark");
                localStorage.setItem("theme", "dark");
            }
        });

        const saved = localStorage.getItem("theme");
        if (saved === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        closeFull.addEventListener("click", () => {
            fullModal.style.display = "none";
        });

        window.openFullText = (title, text) => {
            fullTitle.textContent = title;
            fullContent.textContent = text;
            fullModal.style.display = "flex";
        };

        window.addEventListener("dragover", e => e.preventDefault());
        window.addEventListener("drop", e => e.preventDefault());

        function makeCompareDrop(dropEl, selectBtnEl) {
            dropEl.addEventListener("dragover", e => {
                e.preventDefault();
                dropEl.classList.add("dragover");
            });
            dropEl.addEventListener("dragleave", () => {
                dropEl.classList.remove("dragover");
            });
            dropEl.addEventListener("drop", e => {
                e.preventDefault();
                dropEl.classList.remove("dragover");
                if (e.dataTransfer.files.length) {
                    loadCompareFile(e.dataTransfer.files[0], dropEl);
                }
            });
            selectBtnEl.addEventListener("click", () => {
                const inp = document.createElement("input");
                inp.type = "file";
                inp.accept = ".txt,.docx";
                inp.onchange = e => {
                    if (e.target.files.length) {
                        loadCompareFile(e.target.files[0], dropEl);
                    }
                };
                inp.click();
            });
        }

        makeCompareDrop(compareDrop1, compareSelect1);
        makeCompareDrop(compareDrop2, compareSelect2);

        async function loadCompareFile(file, dropEl) {
            try {
                let text = "";
                const ext = file.name.split(".").pop().toLowerCase();
                if (ext === "txt") {
                    text = await readTxt(file);
                } else if (ext === "docx") {
                    text = await readDocx(file);
                } else {
                    alert("仅支持 txt / docx");
                    return;
                }
                dropEl.innerHTML = `<p style="margin:0;">✅ 已加载：${file.name}</p>`;
            } catch (err) {
                alert("读取失败：" + err.message);
            }
        }

        dropArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropArea.classList.add("dragover");
        });
        dropArea.addEventListener("dragleave", () => {
            dropArea.classList.remove("dragover");
        });
        dropArea.addEventListener("drop", (e) => {
            e.preventDefault();
            dropArea.classList.remove("dragover");
            processFiles(Array.from(e.dataTransfer.files));
        });

        selectBtn.addEventListener("click", () => {
            const inp = document.createElement("input");
            inp.type = "file";
            inp.multiple = true;
            inp.accept = ".docx,.txt";
            inp.onchange = e => processFiles(Array.from(e.target.files));
            inp.click();
        });

        function statText(text) {
            const pure = text.replace(/\s+/g, "");
            const paras = text.split("\n").filter(p => p.trim());
            const sents = text.split(/[。！？；\n]/).filter(s => s.trim());
            return {
                chars: pure.length,
                paraCnt: paras.length,
                sentCnt: sents.length
            };
        }

        async function readTxt(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(r.result);
                r.onerror = reject;
                r.readAsText(file, "utf-8");
            });
        }

        async function readDocx(file) {
            const buf = await file.arrayBuffer();
            const r = await mammoth.extractRawText({ arrayBuffer: buf });
            return r.value;
        }

        async function aiSummary(text) {
            const max = parseInt(wordLimitInput.value) || 300;
            const style = styleSelect.value;
            let prompt = "";

            if (style === "concise") {
                prompt = `
请极简总结，只保留核心，越短越好，不展开、不解释，字数≤${max}：
${text}`.trim();
            } else if (style === "detailed") {
                prompt = `
请详细完整总结，内容饱满、逻辑清晰，尽量接近${max}字，不超：
${text}`.trim();
            } else {
                prompt = `
流畅自然总结，≤${max}字：
${text}`.trim();
            }

            const res = await fetch(DEEPSEEK_URL, {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + DEEPSEEK_API_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [{ role: "user", content: prompt }],
                    temperature: style === "creative" ? 0.7 : 0.2,
                    max_tokens: 1000
                })
            });

            const data = await res.json();
            if (data.error) throw new Error(data.error.message);
            let result = data.choices[0].message.content;

            if (result.length > max + 20) {
                let trimmed = result.slice(0, max);
                let last = Math.max(
                    trimmed.lastIndexOf("。"),
                    trimmed.lastIndexOf("！"),
                    trimmed.lastIndexOf("？")
                );
                result = last > 0 ? trimmed.slice(0, last + 1) : trimmed;
            }

            return result;
        }

        async function extractKeywords(text) {
            const prompt = "提取5-10个关键词，逗号分隔：\n" + text;
            const res = await fetch(DEEPSEEK_URL, {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + DEEPSEEK_API_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [{ role: "user", content: prompt }],
                    temperature: 0.3,
                    max_tokens: 200
                })
            });
            const data = await res.json();
            return data.choices?.[0]?.message?.content || "无";
        }

        function copySummary(text) {
            navigator.clipboard.writeText(text).then(() => alert("已复制！"));
        }

        function renderCard(item) {
            const cnt = item.summary ? `<div class="char-count">${item.summary.length} 字</div>` : "";
            const keywords = item.keywords ? `<div class="keywords"><strong>关键词：</strong>${item.keywords}</div>` : "";
            const readBtn = item.fullText
                ? `<button class="btn btn-sm" onclick="openFullText('${item.filename}', \`${item.fullText.replace(/`/g, '')}\`)">完整阅读</button>`
                : "";
            const copyBtn = item.summary
                ? `<button class="btn btn-sm" onclick="copySummary(\`${item.summary.replace(/`/g, '')}\`)">一键复制总结</button>`
                : "";

            return `
            <div class="card">
                <h4>${item.filename}</h4>
                <div class="info">
                    <div>字数：${item.chars}</div>
                    <div>段落：${item.paraCnt}</div>
                    <div>句子：${item.sentCnt}</div>
                    <div>类型：${item.ext}</div>
                </div>
                <div class="preview"><pre>${item.preview}</pre></div>
                <div class="summary">${item.summary || '<span class="loading">生成总结中…</span>'}</div>
                ${cnt}
                ${keywords}
                <div class="copy-row">${readBtn} ${copyBtn}</div>
            </div>`;
        }

        function getHistory() {
            return JSON.parse(localStorage.getItem("docSummaryHistory") || "[]");
        }

        function saveHistory(item) {
            const hist = getHistory();
            hist.unshift({ id: Date.now(), time: new Date().toLocaleString(), ...item });
            localStorage.setItem("docSummaryHistory", JSON.stringify(hist));
            renderHistory();
        }

        function deleteHistory(id) {
            let hist = getHistory().filter(h => h.id !== id);
            localStorage.setItem("docSummaryHistory", JSON.stringify(hist));
            renderHistory();
        }

        function clearAllHistory() {
            if (confirm("确定清空？")) {
                localStorage.removeItem("docSummaryHistory");
                renderHistory();
            }
        }

        function renderHistory() {
            const hist = getHistory();
            if (!hist.length) {
                historyList.innerHTML = '<div class="empty-history">暂无记录</div>';
                return;
            }
            historyList.innerHTML = hist.map(h => `
                <div class="history-item" onclick="loadHistory(${h.id})">
                    <div>
                        <div class="name">${h.filename}</div>
                        <div class="time">${h.time}</div>
                    </div>
                    <button class="del" onclick="event.stopPropagation();deleteHistory(${h.id})">删除</button>
                </div>
            `).join("");
        }

        function loadHistory(id) {
            const item = getHistory().find(h => h.id === id);
            if (item) resultsDiv.innerHTML = renderCard(item);
        }

        clearHistoryBtn.addEventListener("click", clearAllHistory);
        window.copySummary = copySummary;
        window.loadHistory = loadHistory;
        window.deleteHistory = deleteHistory;
        renderHistory();

        async function processFiles(files) {
            if (!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY.includes("粘贴")) {
                alert("请填写 API Key");
                return;
            }
            const wl = parseInt(wordLimitInput.value);
            if (wl < 50 || wl > 500) {
                alert("字数 50–500");
                return;
            }

            resultsDiv.innerHTML = "";
            selectBtn.disabled = true;

            for (const f of files) {
                const ext = f.name.split(".").pop().toLowerCase();
                resultsDiv.innerHTML = renderCard({
                    filename: f.name, ext, chars: "-", paraCnt: "-", sentCnt: "-",
                    preview: "读取中…", summary: null, keywords: null, fullText: ""
                });

                try {
                    let text = "";
                    if (ext === "txt") text = await readTxt(f);
                    else if (ext === "docx") text = await readDocx(f);
                    else throw new Error("不支持");

                    const st = statText(text);
                    const prev = text.slice(0, 600) + (text.length > 600 ? "…" : "");
                    resultsDiv.innerHTML = renderCard({
                        filename: f.name, ext, ...st, preview: prev, summary: null, keywords: null, fullText: text
                    });

                    const [summary, keywords] = await Promise.all([aiSummary(text), extractKeywords(text)]);
                    const final = { filename: f.name, ext, ...st, preview: prev, summary, keywords, fullText: text };
                    resultsDiv.innerHTML = renderCard(final);
                    saveHistory(final);
                } catch (e) {
                    resultsDiv.innerHTML = renderCard({
                        filename: f.name, ext, chars: "-", paraCnt: "-", sentCnt: "-",
                        preview: "失败", summary: e.message, keywords: null, fullText: ""
                    });
                }
            }
            selectBtn.disabled = false;
        }
    </script>
</body>
</html>

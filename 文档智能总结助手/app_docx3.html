<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文档智能总结助手（拖拽修复版）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f4f7fa;
            padding: 30px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 30px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .summary-limit {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .summary-limit input {
            width: 120px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .drop-area {
            border: 2px dashed #dfe3e9;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .drop-area.dragover {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        .drop-area p {
            color: #666;
            margin-bottom: 15px;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background: #2563eb;
        }
        .btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .card {
            border: 1px solid #eaeef5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .card h4 {
            margin-bottom: 10px;
            color: #333;
            font-size: 18px;
        }
        .info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 10px 0;
            color: #555;
            font-size: 14px;
        }
        .preview {
            background: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            max-height: 160px;
            overflow-y: auto;
            margin: 10px 0;
            font-size: 13px;
        }
        .summary {
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #3b82f6;
            color: #2c3e50;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        .char-count {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📄 文档智能总结助手（拖拽上传）</h2>

        <div class="summary-limit">
            <label>总结字数限制：</label>
            <input type="number" id="wordLimit" value="300" min="50" max="500">
            <span>字（50–500）</span>
        </div>

        <div class="drop-area" id="dropArea">
            <p>拖拽 DOCX / TXT / PDF 文件到此处</p>
            <button class="btn" id="selectBtn">或点击选择文件</button>
        </div>

        <div id="results"></div>
    </div>

    <script src="https://unpkg.com/mammoth@1.4.18/mammoth.browser.min.js"></script>
    <script src="https://unpkg.com/pdfjs-dist@3.11.176/build/pdf.min.js"></script>
    <script src="https://unpkg.com/docx@7.1.1/build/docx.bundle.js"></script>
    <script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>

    <script>
        // ===================== 填入你自己的 Deepseek API Key =====================
        const DEEPSEEK_API_KEY = "yours API key";
        const DEEPSEEK_URL = "https://api.deepseek.com/chat/completions";
        const MODEL_NAME = "deepseek-chat";
        // ======================================================================

        const wordLimitInput = document.getElementById("wordLimit");
        const dropArea = document.getElementById("dropArea");
        const selectBtn = document.getElementById("selectBtn");
        const resultsDiv = document.getElementById("results");

        // 全局文件对象
        let currentFiles = [];

        // 禁止浏览器默认打开文件
        window.addEventListener("dragover", (e) => e.preventDefault());
        window.addEventListener("drop", (e) => e.preventDefault());

        // 拖拽区域
        dropArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropArea.classList.add("dragover");
        });

        dropArea.addEventListener("dragleave", () => {
            dropArea.classList.remove("dragover");
        });

        // ✅ 修复：拖拽成功后处理
        dropArea.addEventListener("drop", (e) => {
            e.preventDefault();
            dropArea.classList.remove("dragover");
            const files = Array.from(e.dataTransfer.files);
            if (files.length > 0) {
                processFiles(files);
            }
        });

        // 点击选择
        selectBtn.addEventListener("click", () => {
            const fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.multiple = true;
            fileInput.accept = ".docx,.txt,.pdf";
            fileInput.onchange = (e) => {
                processFiles(Array.from(e.target.files));
            };
            fileInput.click();
        });

        // 统计
        function statText(text) {
            const pure = text.replace(/\s+/g, "");
            const chars = pure.length;
            const paras = text.split("\n").filter(p => p.trim());
            const paraCnt = paras.length;
            const sentCnt = text.split(/[。！？；\n]/).filter(s => s.trim()).length;
            return { chars, paraCnt, sentCnt };
        }

        // 读取文件
        async function readTxt(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file, "utf-8");
            });
        }

        async function readDocx(file) {
            const buffer = await file.arrayBuffer();
            const result = await mammoth.convertToHtml({ arrayBuffer: buffer });
            return result.value.replace(/<[^>]+>/g, "");
        }

        async function readPdf(file) {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buffer) }).promise;
            let text = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                text += content.items.map(it => it.str).join(" ") + "\n";
            }
            return text;
        }

        // AI 总结
        async function aiSummary(text) {
            const wordLimit = parseInt(wordLimitInput.value) || 300;
            const prompt = `请对下面文档做简洁、要点完整的总结，严格控制在${wordLimit}字以内：\n${text}`;

            const res = await fetch(DEEPSEEK_URL, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${DEEPSEEK_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [{ role: "user", content: prompt }],
                    temperature: 0.7,
                    max_tokens: 1000
                })
            });

            const data = await res.json();
            if (data.error) throw new Error(data.error.message);
            let summary = data.choices[0].message.content;
            if (summary.length > wordLimit) {
                summary = summary.slice(0, wordLimit).replace(/([。！？；])[^。！？；]*$/, "$1") + "。";
            }
            return summary;
        }

        // 导出 Word
        async function exportWord(filename, summary) {
            const { Document, Paragraph, HeadingLevel, TextRun } = window.docx;
            const doc = new Document({
                sections: [{
                    children: [
                        new Paragraph({ heading: HeadingLevel.TITLE, children: [new TextRun(`文档：${filename}`)] }),
                        new Paragraph({ heading: HeadingLevel.HEADING_1, children: [new TextRun("智能总结")] }),
                        new Paragraph(summary),
                        new Paragraph(`字数：${summary.length} 字`)
                    ]
                }]
            });
            const blob = await window.docx.Packer.toBlob(doc);
            saveAs(blob, `总结_${filename.replace(/\.[^/.]+$/, "")}.docx`);
        }

        // 渲染卡片
        function renderCard(item) {
            const count = item.summary ? `<div class="char-count">${item.summary.length} 字</div>` : "";
            return `
            <div class="card">
                <h4>${item.filename}</h4>
                <div class="info">
                    <div>字数：${item.chars}</div>
                    <div>段落：${item.paraCnt}</div>
                    <div>句子：${item.sentCnt}</div>
                    <div>类型：${item.ext}</div>
                </div>
                <div class="preview"><pre>${item.preview}</pre></div>
                <div class="summary">${item.summary || '<span class="loading">正在生成总结…</span>'}${count}</div>
                ${item.summary ? `<button class="btn exportBtn">导出 Word</button>` : ""}
            </div>`;
        }

        // 处理文件
        async function processFiles(files) {
            if (!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY.includes("在这里")) {
                alert("请先在代码里填入你的 Deepseek API Key！");
                return;
            }
            const wl = parseInt(wordLimitInput.value);
            if (isNaN(wl) || wl < 50 || wl > 500) {
                alert("字数必须在 50–500 之间");
                return;
            }

            resultsDiv.innerHTML = "";
            selectBtn.disabled = true;

            for (const file of files) {
                const ext = file.name.split(".").pop().toLowerCase();
                const id = "c" + Date.now() + Math.random();
                resultsDiv.innerHTML += `<div id="${id}">${renderCard({
                    filename: file.name, ext: ext, chars: "-", paraCnt: "-", sentCnt: "-",
                    preview: "读取中…", summary: null
                })}</div>`;
                const el = document.getElementById(id);

                try {
                    let content = "";
                    if (ext === "txt") content = await readTxt(file);
                    else if (ext === "docx") content = await readDocx(file);
                    else if (ext === "pdf") content = await readPdf(file);
                    else throw new Error("不支持此格式");

                    const { chars, paraCnt, sentCnt } = statText(content);
                    const preview = content.slice(0, 600) + (content.length > 600 ? "..." : "");
                    el.innerHTML = renderCard({
                        filename: file.name, ext, chars, paraCnt, sentCnt, preview, summary: null
                    });

                    const summary = await aiSummary(content);
                    el.innerHTML = renderCard({
                        filename: file.name, ext, chars, paraCnt, sentCnt, preview, summary
                    });

                    el.querySelector(".exportBtn").onclick = () => exportWord(file.name, summary);
                } catch (e) {
                    el.innerHTML = renderCard({
                        filename: file.name, ext, chars: "-", paraCnt: "-", sentCnt: "-",
                        preview: "错误", summary: "失败：" + e.message
                    });
                }
            }
            selectBtn.disabled = false;
        }
    </script>
</body>
</html>
